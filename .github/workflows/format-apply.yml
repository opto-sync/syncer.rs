name: Formatter apply

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/format-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust toolchain and WASM target
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
      - name: Apply Rust formatter
        run: cargo +1.97.1 fmt --all
      - name: Commit formatter-exact source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/causal.rs src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "Apply pinned Rust formatter"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Run strict Clippy
        run: cargo +1.97.1 clippy --all-targets --all-features -- -D warnings
      - name: Run native tests
        run: cargo +1.97.1 test --all-targets
      - name: Build native release
        run: cargo +1.97.1 build --release
      - name: Build WASM release
        run: cargo +1.97.1 build --release --target wasm32-unknown-unknown --features wasm
